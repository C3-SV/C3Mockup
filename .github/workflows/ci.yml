name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Valores de prueba: el build no necesita secretos reales (ver docs/process/ci-cd.md).
  BREVO_SENDER_EMAIL: ci@example.com
  BREVO_SENDER_NAME: CI
  FIREBASE_PROJECT_ID: ci-project
  FIREBASE_CLIENT_EMAIL: ci@example.iam.gserviceaccount.com
  REVALIDATION_WEBHOOK_SECRET: ci-secret

jobs:
  quality:
    name: Lint, typecheck y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: Pruebas unitarias y de componentes
    # Activar al completar la Fase 0 del plan (existe `pnpm test`).
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: E2E y accesibilidad (390 y 1280 px)
    # Activar al completar la Fase 0 del plan (existe `pnpm test:e2e`).
    if: false
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @c3/web exec playwright install --with-deps chromium
      - run: pnpm build:web
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
